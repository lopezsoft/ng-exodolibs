<ng-template #projectedContent>
  <ng-content></ng-content>
</ng-template>
<ng-container *ngIf="!customBody" [ngTemplateOutlet]="projectedContent"></ng-container>
<div class="exodogrid-content-style">
  <div class="card table-responsive card-table mb-1" *ngIf="leafColumns.length > 0 || columns.length > 0">
      <div class="grid-loading" [ngClass]="{'show': isLoading}">
          <div class="grid-spinner"></div>
      </div>
      <div class="card-header">
          <h6 *ngIf="caption" class="card-title">{{ caption | uppercase }}</h6>
          <ng-content select="[header]"></ng-content>
          <div class="input-group grid-search">
              <input type="search"
                     #searchField
                     [id]="searchFieldId"
                     class="form-control"
                     [placeholder]="placeholder"
                     [attr.aria-label]="placeholder"
                     (keyup)="inputKey($event)"
                     (input)="inputSearch($event)"
                     (change)="$event.stopPropagation()">
              <button type="button"
                      class="btn btn-primary"
                      [attr.aria-label]="placeholder"
                      (click)="searchQuery(searchField.value)"
                      [disabled]="isLoading || mode === 'local'">
                <i class="fas fa-search" aria-hidden="true"></i>
              </button>
          </div>
      </div>
      <div class="card-body">
          <table class="exodogrid-table table-striped table-hover"
                 [class.table-bordered]="bordered"
                 [attr.aria-colcount]="leafColumns.length || columns.length"
                 #tableGrid
                 [id]="uuid">
              <thead>
                <ng-template #myCustomHeader>
                  <ng-content select="[tableHeader]"></ng-content>
                </ng-template>
                <ng-container *ngIf="!customHeader; else myCustomHeader">
                  <!-- Render encabezados multinivel construidos desde headerRows -->
                  <ng-container *ngFor="let headerRow of headerRows; let rowIndex = index; trackBy: trackByIndex">
                    <tr [attr.aria-rowindex]="rowIndex + 1" class="text-center">
                      <th *ngFor="let header of headerRow; trackBy: trackByColumn"
                          [attr.colspan]="header.colspan || null"
                          [attr.rowspan]="header.rowspan || null"
                          [style.width]="normalizeWidth(header.width)"
                          (click)="sort(header)"
                          [class.sortable]="allowSorting && header.dataIndex && (header.sortable !== false)">
                        {{ header.text }}
                        <i *ngIf="allowSorting && header.dataIndex && sortColumn === header.dataIndex"
                           class="fas"
                           aria-hidden="true"
                           [ngClass]="{'fa-sort-up': sortDirection === 'asc', 'fa-sort-down': sortDirection === 'desc'}"></i>
                      </th>
                    </tr>
                  </ng-container>
                  <!-- Fila de filtros (solo para las columnas hoja visibles) -->
                  <tr *ngIf="allowFiltering">
                    <th *ngFor="let column of leafColumns; trackBy: trackByColumn">
                      <lib-grid-filter [column]="column" (onFilter)="applyGridFilter($event)"></lib-grid-filter>
                    </th>
                  </tr>
                </ng-container>
              </thead>
              <tbody>
                <ng-template #myCustomBody>
                  <ng-container *ngIf="customBody && canData()" [ngTemplateOutlet]="projectedContent"></ng-container>
                </ng-template>
                <ng-container *ngIf="canData() && !customBody; else myCustomBody">
                  <tr *ngFor="let row of displayedRows; index as rowIndex; trackBy: trackByRow"
                      [attr.aria-rowindex]="rowIndex + headerRowOffset"
                      role="row">
                    <td *ngFor="let column of leafColumns; index as columnIndex; trackBy: trackByColumn"
                        role="gridcell"
                        [attr.aria-colindex]="columnIndex + 1">
                      <el-grid-cell
                        [column]="column"
                        [row]="row"
                        [rowIndex]="rowIndex"
                        [columnIndex]="columnIndex"
                        [dataSource]="dataSource"
                        (onChange)="onCellChange($event, row, column, rowIndex, columnIndex)"
                      ></el-grid-cell>
                    </td>
                  </tr>
                </ng-container>
                <ng-container *ngIf="!canData()">
                  <tr [attr.aria-rowindex]="headerRowOffset" role="row">
                    <td [attr.colspan]="leafColumns.length || columns.length || 1" role="gridcell" aria-colindex="1">
                      <div class="w-100 grid-empty">
                        {{ emptyMessage }}
                      </div>
                    </td>
                  </tr>
                </ng-container>
              </tbody>
              <tfoot class="w-100" *ngIf="showSummary">
                <ng-content select="[tableFooter]"></ng-content>
              </tfoot>
          </table>
      </div>
      <div class="card-footer" *ngIf="(showPagination === true && mode === 'remote')">
          <exodo-pagination class="table-responsive" #pagination
                            (onRefreshPagination)="onRefreshPagination($event)"
                            [labels]="labels"
                            [theme]="theme">
          </exodo-pagination>
      </div>
  </div>
</div>
