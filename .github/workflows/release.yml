name: Create GitHub Release

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Marcar release como prerelease'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Resolve and validate version
        id: meta
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          LIB_VERSION=$(node -p "require('./projects/exodolibs/package.json').version")
          if [ "$ROOT_VERSION" != "$LIB_VERSION" ]; then
            echo "Version mismatch between package.json ($ROOT_VERSION) and projects/exodolibs/package.json ($LIB_VERSION)"
            exit 1
          fi
          echo "version=$LIB_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$LIB_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if GitHub Release already exists (idempotent)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG ya existe; omitiendo creación."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure annotated Git tag exists on origin
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG ya existe en origin."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG (exodolibs $VERSION)"
            git push origin "$TAG"
          fi

      - name: Install dependencies and pack library tarball
        if: steps.check.outputs.exists == 'false'
        run: |
          npm ci
          npm run lib
          mkdir -p release-assets
          npm pack ./dist/exodolibs --pack-destination ./release-assets

      - name: Generate release notes
        if: steps.check.outputs.exists == 'false'
        run: |
          node scripts/build-release-notes.mjs "${{ steps.meta.outputs.version }}" .release-notes.md

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          TARBALL="release-assets/exodolibs-${VERSION}.tgz"
          FLAGS=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            FLAGS="--prerelease"
          fi
          gh release create "$TAG" "$TARBALL" \
            --title "exodolibs $TAG" \
            --notes-file .release-notes.md \
            $FLAGS
