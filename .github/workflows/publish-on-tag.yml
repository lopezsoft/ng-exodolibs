name: Publish package on tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag o versión a verificar (opcional, usa projects/exodolibs/package.json si se omite)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Verify, Test, Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify version consistency
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          LIB_VERSION=$(node -p "require('./projects/exodolibs/package.json').version")
          if [ "$ROOT_VERSION" != "$LIB_VERSION" ]; then
            echo "Version mismatch: root=$ROOT_VERSION lib=$LIB_VERSION"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$LIB_VERSION" ]; then
              echo "Version mismatch: tag=$TAG_VERSION lib=$LIB_VERSION"
              exit 1
            fi
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (library and demo app)
        run: npm run test:ci

      - name: Build library
        run: npm run lib

      - name: Verify packaged stylesheet assets
        run: |
          test -f dist/exodolibs/assets/style.scss
          test -f dist/exodolibs/lib/style.scss
          test -f dist/exodolibs/lib/assets/style.scss
          test -f dist/exodolibs/LICENSE

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          cd dist/exodolibs
          if [ "$IS_PRIVATE" = "false" ]; then
            npm publish --provenance --access public || npm publish --access public
          else
            npm publish --access public
          fi
